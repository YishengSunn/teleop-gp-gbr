leader:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      move_to_start_example_controller:
        type: franka_example_controllers/MoveToStartExampleController

      joint_impedance_example_controller:
        type: franka_example_controllers/JointImpedanceExampleController
      
      cartesian_impedance_example_controller:
        type: franka_example_controllers/CartesianImpedanceExampleController

      joint_position_example_controller:
        type: franka_example_controllers/JointPositionExampleController

      joint_velocity_example_controller:
        type: franka_example_controllers/JointVelocityExampleController
      
      cartesian_velocity_example_controller:
        type: franka_example_controllers/CartesianVelocityExampleController

      joint_trajectory_controller:
        type: joint_effort_trajectory_controller/JointTrajectoryController

      model_example_controller:
        type: franka_example_controllers/ModelExampleController

      gravity_compensation_example_controller:
        type: franka_example_controllers/GravityCompensationExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
      
      gravity_compensation_with_joint_torque_feedback_controller:
        type: geo_gp_controllers/GravityCompensationWithJointTorqueFeedbackController

      gravity_compensation_with_cartesian_force_feedback_controller:
        type: geo_gp_controllers/GravityCompensationWithCartesianForceFeedbackController
      
      haptic_gravity_compensation_controller:
        type: franka_example_controllers/HapticGravityCompensationController

  move_to_start_example_controller:
    ros__parameters:
      arm_id: leader
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.

  joint_impedance_example_controller:
    ros__parameters:
      arm_id: leader
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

  cartesian_impedance_example_controller:
    ros__parameters:
      arm_id: leader

  joint_position_example_controller:
    ros__parameters:
      arm_id: leader

  joint_velocity_example_controller:
    ros__parameters:
      arm_id: leader

  cartesian_velocity_example_controller:
    ros__parameters:
      arm_id: leader

  joint_trajectory_controller:
    ros__parameters:
      joints:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      gains:
        panda_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        panda_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        panda_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

  model_example_controller:
    ros__parameters:
      arm_id: leader

  franka_robot_state_broadcaster:
    ros__parameters:
      arm_id: leader

  haptic_gravity_compensation_controller:
    ros__parameters:
      arm_id: leader
      follower_input_mode: "joint_states"  # or "torque_topic"
      follower_torque_topic: /haptic/follower_tau
      joint_state_topic: /joint_states
      lpf_alpha: 0.1
      torque_clamp: [6.0, 6.0, 6.0, 6.0, 3.0, 3.0, 2.0]

      # Gains for converting follower joint-state error into haptic torque.
      # Used only when follower_input_mode is "joint_states".
      k_gains: [300.0, 300.0, 300.0, 250.0, 150.0, 100.0, 50.0]
      d_gains: [10.0, 10.0, 10.0, 8.0, 6.0, 4.0, 3.0]

      # Optional desired joint-position output for the follower-side impedance controller
      publish_desired_q: true
      desired_q_topic: /joint_impedance/joints_desired

  gravity_compensation_with_joint_torque_feedback_controller:
    ros__parameters:
      arm_id: leader
      enable_feedback: true

      # Gains for the move-to-start controller
      move_to_start: true
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [30.0, 30.0, 30.0, 30.0, 10.0, 10.0, 5.0]

      # TDPA parameters
      TDPA_active: true
      tau_ext_feedback: true
      k_pos_drift: 0.0
      eta_passivity_shortage: 0.0
      remote_state_topic: /follower/tdpa_joint_state_delayed
      local_state_topic: /leader/tdpa_joint_state

      # Non-TDPA haptic feedback path. When TDPA_active is true, feedback is carried by
      # /follower/tdpa_joint_state_delayed and the torque topic settings below are ignored.
      feedback_source: "measured"  # measured: external torque estimate; commanded: controller torque
      torque_feedback_topic: ""    # Empty selects the topic from feedback_source; non-empty overrides

      feedback_scale: 0.5            # Gain applied before sending torque to the leader
      subtract_first_bias: true      # Treat the first valid torque sample as the zero offset
      feedback_max_abs_tau: 15.0     # Per-joint torque clamp after scaling (Nm)
      feedback_additive: false       # false: keep move-to-start PD isolated from haptic feedback

      suppress_feedback_during_execution: true
      execution_running_topic: "/execution/running"
      blend_running_topic: "/execution/blend_to_leader_running"
      execution_feedback_scale: 0.2  # Extra multiplier while executing or blending (0 disables feedback)

  gravity_compensation_with_cartesian_force_feedback_controller:
    ros__parameters:
      arm_id: leader
      enable_feedback: true

      # Gains for the move-to-start controller
      move_to_start: true
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [30.0, 30.0, 30.0, 30.0, 10.0, 10.0, 5.0]

      # TDPA parameters
      TDPA_active: true
      tau_ext_feedback: true
      k_pos_drift: 0.0
      eta_passivity_shortage: 0.0
      remote_state_topic: /follower/tdpa_cartesian_state_delayed
      local_state_topic: /leader/tdpa_cartesian_state

      # Non-TDPA haptic feedback path. When TDPA_active is true, feedback is carried by
      # /follower/tdpa_cartesian_state_delayed and the torque topic settings below are ignored.
      feedback_source: "measured"  # measured: external torque estimate; commanded: controller torque
      torque_feedback_topic: ""    # Empty selects the topic from feedback_source; non-empty overrides

      feedback_scale: 0.5            # Gain applied before sending torque to the leader
      subtract_first_bias: true      # Treat the first valid torque sample as the zero offset
      feedback_max_abs_tau: 15.0     # Per-joint torque clamp after scaling (Nm)
      feedback_additive: false       # false: keep move-to-start PD isolated from haptic feedback

      suppress_feedback_during_execution: true
      execution_running_topic: "/execution/running"
      blend_running_topic: "/execution/blend_to_leader_running"
      execution_feedback_scale: 0.2  # Extra multiplier while executing or blending (0 disables feedback)

follower:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      move_to_start_example_controller:
        type: franka_example_controllers/MoveToStartExampleController

      joint_impedance_example_controller:
        type: franka_example_controllers/JointImpedanceExampleController
      
      cartesian_impedance_example_controller:
        type: franka_example_controllers/CartesianImpedanceExampleController

      joint_position_example_controller:
        type: franka_example_controllers/JointPositionExampleController

      joint_velocity_example_controller:
        type: franka_example_controllers/JointVelocityExampleController
      
      cartesian_velocity_example_controller:
        type: franka_example_controllers/CartesianVelocityExampleController

      joint_trajectory_controller:
        type: joint_effort_trajectory_controller/JointTrajectoryController

      model_example_controller:
        type: franka_example_controllers/ModelExampleController

      gravity_compensation_example_controller:
        type: franka_example_controllers/GravityCompensationExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      franka_torque_broadcaster:
        type: franka_torque_broadcaster/FrankaTorqueBroadcaster
      
      joint_impedance_controller:
        type: geo_gp_controllers/JointImpedanceController
      
      cartesian_impedance_controller:
        type: geo_gp_controllers/CartesianImpedanceController

      hybrid_position_force_controller:
        type: geo_gp_controllers/HybridPositionForceController

  move_to_start_example_controller:
    ros__parameters:
      arm_id: follower
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

  joint_impedance_example_controller:
    ros__parameters:
      arm_id: follower
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

  cartesian_impedance_example_controller:
    ros__parameters:
      arm_id: follower

  joint_position_example_controller:
    ros__parameters:
      arm_id: follower

  joint_velocity_example_controller:
    ros__parameters:
      arm_id: follower

  cartesian_velocity_example_controller:
    ros__parameters:
      arm_id: follower
  
  franka_robot_state_broadcaster:
    ros__parameters:
      arm_id: follower

  franka_torque_broadcaster:
    ros__parameters:
      arm_id: follower
      frequency: 100

  joint_trajectory_controller:
    ros__parameters:
      joints:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6  
        - panda_joint7
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      gains:
        panda_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        panda_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        panda_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        panda_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

  model_example_controller:
    ros__parameters:
      arm_id: follower

  joint_impedance_controller:
    ros__parameters:
      command_arm_id: follower
      source_arm_id: leader
      joint_impedance_topic: /leader/joint_states

      # Gains for the joint impedance controller
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [30.0, 30.0, 30.0, 10.0, 10.0, 10.0, 5.0]

      # TDPA parameters
      TDPA_active: true
      tau_ext_feedback: true
      k_pos_drift: 0.0
      eta_passivity_shortage: 0.0
      remote_state_topic: /leader/tdpa_joint_state_delayed
      local_state_topic: /follower/tdpa_joint_state

      # Gains for the move-to-start controller
      move_to_start: true
      start_k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      start_d_gains: [30.0, 30.0, 30.0, 10.0, 10.0, 10.0, 5.0]

  cartesian_impedance_controller:
    ros__parameters:
      arm_id: follower
      leader_robot_state_topic: /leader/franka_robot_state_broadcaster/robot_state

      # Gains for the move-to-start controller
      move_to_start: true
      start_k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      start_d_gains: [30.0, 30.0, 30.0, 10.0, 10.0, 10.0, 5.0]
      
      # Stiffness and damping for the Cartesian impedance controller
      pos_stiff: 600.0
      rot_stiff: 30.0

      # TDPA parameters
      TDPA_active: true
      tau_ext_feedback: true
      k_pos_drift: 0.0
      eta_passivity_shortage: 0.0
      remote_state_topic: /leader/tdpa_cartesian_state_delayed
      local_state_topic: /follower/tdpa_cartesian_state

      # Topics for executing and blending to the leader
      execution_running_topic: "/execution/running"
      execution_pose_topic: "/execution/desired_pose"
      blend_running_topic: "/execution/blend_to_leader_running"

      # Parameters for blending to the leader
      blend_to_leader_enabled: true
      blend_seconds_per_meter: 2.0
      blend_seconds_per_rad: 1.2
      blend_duration_min: 0.25
      blend_duration_max: 8.0
      blend_running_hold_sec: 0.5

      # APC is only applied while online_fuser publishes its active latch
      autonomy_passivity_with_online_fuser: true
      online_fuser_active_topic: "/execution/online_fuser_active"
      autonomy_tank_initial_energy: 2.0
      autonomy_tank_max_energy: 5.0
      autonomy_tank_recharge_efficiency: 0.8
      autonomy_wrench_max_abs: 100.0

  hybrid_position_force_controller:
    ros__parameters:
      arm_id: follower
      leader_robot_state_topic: /leader/franka_robot_state_broadcaster/robot_state

      # Gains for the move-to-start controller
      move_to_start: true
      start_k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      start_d_gains: [30.0, 30.0, 30.0, 10.0, 10.0, 10.0, 5.0]

      # Stiffness and damping for the hybrid position force controller
      pos_stiff: 500.0
      rot_stiff: 20.0
      n_stiffness: 10.0

      # TDPA parameters
      TDPA_active: true
      tau_ext_feedback: true
      k_pos_drift: 0.0
      eta_passivity_shortage: 0.0
      remote_state_topic: /leader/tdpa_cartesian_state_delayed
      local_state_topic: /follower/tdpa_cartesian_state

      # Topics for executing and blending to the leader
      execution_running_topic: "/execution/running"
      execution_pose_topic: "/execution/desired_pose"
      desired_force_topic: "/execution/desired_force"
      blend_running_topic: "/execution/blend_to_leader_running"

      # Parameters for the hybrid position force controller
      force_axis: "z"
      force_kp: 1.0
      force_ki: 0.2
      force_damping: 5.0
      force_feedforward_scale: 1.0
      force_integral_limit: 10.0
      force_command_max_abs: 30.0
      measured_force_filter_alpha: 0.95
      initial_desired_force: 0.0

      # Parameters for blending to the leader
      blend_to_leader_enabled: true
      blend_seconds_per_meter: 2.0
      blend_seconds_per_rad: 1.2
      blend_duration_min: 0.25
      blend_duration_max: 8.0
      blend_running_hold_sec: 0.5
